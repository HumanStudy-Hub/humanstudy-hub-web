name: Research catalog checks
on:
  pull_request:
    paths: ['lib/research.ts', 'lib/community*.ts', 'app/api/research/**', 'app/api/community/**', 'data/research_index.json', 'supabase/migrations/*research*', 'tests/research*.mjs', 'tests/community.test.mjs', 'package*.json', '.github/workflows/research-catalog.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:studio
